name: Синхронизация каталога с каналом

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (GitHub может задерживать на несколько минут)
  workflow_dispatch:         # и кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Забрать новые посты и пересобрать витрину
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          CHANNEL: ${{ vars.CHANNEL || '@eurostockmoscowshop' }}
        run: node bot/sync.js
      - name: Опубликовать изменения
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Изменений нет" || (git commit -m "sync: $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
